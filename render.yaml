services:
  - type: web
    name: crickanalysis
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    buildFilter:
      ignoredPaths:
        - mobile/**
    envVars:
      - key: CRICKANALYSIS_DATA_DIR
        value: /tmp/crickanalysis
      - key: MAX_UPLOAD_BYTES
        value: "536870912"
      - key: PYTHONUNBUFFERED
        value: "1"
