services:
  - type: web
    name: crickanalysis
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /api/health
    envVars:
      - key: CRICKANALYSIS_DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_BYTES
        value: "1073741824"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: crickanalysis-data
      mountPath: /var/data
      sizeGB: 5
