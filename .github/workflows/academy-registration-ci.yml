name: Academy Registration CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/academy_registration_api.py'
      - 'app/academy_registration_validation_policy.py'
      - 'app/academy_registration_address_validation.py'
      - 'app/academy_registration_branding_api.py'
      - 'app/academy_rbac_middleware.py'
      - 'run.py'
      - 'app/static/academy_registration_v1.js'
      - 'app/static/academy_registration_copy_link_fix_v1.js'
      - 'app/static/academy_registration_review_policy_v2.js'
      - 'app/static/academy_registration_phone_validation_v1.js'
      - 'app/static/academy_registration_v1.css'
      - 'app/static/academy_registration_public_v1.html'
      - 'app/static/academy_registration_public_v1.js'
      - 'app/static/academy_registration_public_v1.css'
      - 'app/static/academy_primary_nav_v1.js'
      - 'app/static/index.html'
      - 'tests/conftest.py'
      - 'tests/test_academy_registration_api.py'
      - 'tests/test_academy_registration_manual_fixes.py'
      - 'tests/test_academy_registration_address_branding.py'
      - '.github/workflows/academy-registration-ci.yml'
  pull_request:
    paths:
      - 'app/academy_registration_api.py'
      - 'app/academy_registration_validation_policy.py'
      - 'app/academy_registration_address_validation.py'
      - 'app/academy_registration_branding_api.py'
      - 'app/academy_rbac_middleware.py'
      - 'run.py'
      - 'app/static/academy_registration_v1.js'
      - 'app/static/academy_registration_copy_link_fix_v1.js'
      - 'app/static/academy_registration_review_policy_v2.js'
      - 'app/static/academy_registration_phone_validation_v1.js'
      - 'app/static/academy_registration_v1.css'
      - 'app/static/academy_registration_public_v1.html'
      - 'app/static/academy_registration_public_v1.js'
      - 'app/static/academy_registration_public_v1.css'
      - 'app/static/academy_primary_nav_v1.js'
      - 'app/static/index.html'
      - 'tests/conftest.py'
      - 'tests/test_academy_registration_api.py'
      - 'tests/test_academy_registration_manual_fixes.py'
      - 'tests/test_academy_registration_address_branding.py'
      - '.github/workflows/academy-registration-ci.yml'

permissions:
  contents: read

jobs:
  registration-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx2
      - name: Compile registration modules
        run: >-
          python -m py_compile
          app/academy_registration_api.py
          app/academy_registration_validation_policy.py
          app/academy_registration_address_validation.py
          app/academy_registration_branding_api.py
          tests/test_academy_registration_api.py
          tests/test_academy_registration_manual_fixes.py
          tests/test_academy_registration_address_branding.py
      - name: Run registration workflow tests
        run: >-
          pytest -q
          tests/test_academy_registration_api.py
          tests/test_academy_registration_manual_fixes.py
          tests/test_academy_registration_address_branding.py
