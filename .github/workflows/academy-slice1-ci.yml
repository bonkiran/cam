name: Academy Slice 1 CI

on:
  push:
    branches:
      - main
      - academy-slice1-player-guardian
      - academy-fix-website-validation
      - academy-player-ui-tests
  pull_request:
    paths:
      - 'app/**'
      - 'tests/test_academy_slice1.py'
      - 'tests/test_academy_players_ui.py'
      - 'tests/test_academy_guardians_ui.py'
      - 'tests/test_academy_extended_ui.py'
      - 'run.py'
      - 'requirements.txt'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium

      - name: Compile Python
        run: python -m compileall -q app run.py tests/test_academy_players_ui.py tests/test_academy_guardians_ui.py tests/test_academy_extended_ui.py

      - name: Check academy JavaScript syntax
        run: |
          node --check app/static/academy_v3.js
          node --check app/static/academy_validation_v1.js
          node --check app/static/nav_structure_v3.js

      - name: Test academy website normalization
        run: |
          node - <<'NODE'
          const assert = require('assert');
          const { normalizeWebsite, isValidWebsite } = require('./app/static/academy_validation_v1.js');
          assert.equal(normalizeWebsite('www.ssrj.com'), 'https://www.ssrj.com');
          assert.equal(normalizeWebsite('ssrj.com'), 'https://ssrj.com');
          assert.equal(normalizeWebsite('https://ssrj.com'), 'https://ssrj.com');
          assert.equal(isValidWebsite('www.ssrj.com'), true);
          assert.equal(isValidWebsite('ssrj.com'), true);
          assert.equal(isValidWebsite('https://ssrj.com/path'), true);
          assert.equal(isValidWebsite('not a website'), false);
          assert.equal(isValidWebsite(''), true);
          NODE

      - name: Run Academy Slice 1 API smoke test on SQLite fallback
        run: pytest -q tests/test_academy_slice1.py

      - name: Run Academy Players browser regression on SQLite fallback
        run: pytest -q tests/test_academy_players_ui.py

      - name: Run Academy Guardians browser regression on SQLite fallback
        run: pytest -q tests/test_academy_guardians_ui.py

      - name: Run extended Academy Setup and Player browser regression on SQLite fallback
        run: pytest -q tests/test_academy_extended_ui.py

      - name: Run Academy Slice 1 API smoke test on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_slice1.py

      - name: Run Academy browser regression on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_players_ui.py tests/test_academy_guardians_ui.py tests/test_academy_extended_ui.py

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-ui-failure
          path: test-results/
          if-no-files-found: ignore
