name: CAM-14 Player Development CI

on:
  push:
    branches:
      - main
      - bongonfun/cam-14-moat-01-passive-player-development-evidence-from-session
  pull_request:
    paths:
      - 'app/academy_player_development_api.py'
      - 'app/academy_attendance_api.py'
      - 'app/static/academy_player_development_v1.js'
      - 'app/static/academy_player_development_v1.css'
      - 'app/static/academy_attendance_v1.js'
      - 'app/static/index.html'
      - 'tests/test_cam14_player_development_api.py'
      - 'tests/test_cam14_player_development_ui.py'
      - 'run.py'
      - '.github/workflows/cam14-player-development-ci.yml'

jobs:
  passive-development-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_cam14_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_cam14_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile and JavaScript syntax check
        run: |
          python -m compileall -q app run.py tests/test_cam14_player_development_api.py tests/test_cam14_player_development_ui.py
          node --check app/static/academy_player_development_v1.js
      - name: CAM-14 API on SQLite
        run: pytest -q tests/test_cam14_player_development_api.py
      - name: CAM-14 API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_cam14_test
        run: pytest -q tests/test_cam14_player_development_api.py
      - name: Existing attendance API regression on SQLite
        run: pytest -q tests/test_academy_attendance_api.py
      - name: CAM-14 Chromium UI on SQLite
        run: pytest -q tests/test_cam14_player_development_ui.py
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cam14-player-development-ui-failure
          path: test-results/
          if-no-files-found: ignore
