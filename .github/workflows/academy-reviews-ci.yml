name: Academy Player Reviews CI

on:
  push:
    branches:
      - main
      - academy-player-reviews
  pull_request:
    paths:
      - 'app/academy_reviews_api.py'
      - 'app/static/academy_reviews_v1.js'
      - 'app/static/academy_reviews_v1.css'
      - 'app/static/index.html'
      - 'tests/test_academy_reviews_api.py'
      - 'tests/test_academy_reviews_ui.py'
      - 'run.py'
      - '.github/workflows/academy-reviews-ci.yml'

jobs:
  reviews-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_BOOTSTRAP_TOKEN: reviews-ci-bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile and JavaScript syntax check
        run: |
          python -m compileall -q app run.py tests/test_academy_reviews_api.py tests/test_academy_reviews_ui.py
          node --check app/static/academy_reviews_v1.js

      - name: Reviews API on SQLite
        run: pytest -q tests/test_academy_reviews_api.py
      - name: Reviews Chromium UI on SQLite
        run: pytest -q tests/test_academy_reviews_ui.py
      - name: Prior Academy API regressions on SQLite
        run: pytest -q tests/test_academy_slice1.py tests/test_academy_programs_api.py tests/test_academy_coaches_api.py tests/test_academy_batches_api.py tests/test_academy_attendance_api.py tests/test_academy_matches_api.py tests/test_academy_tournaments_api.py tests/test_academy_fees_api.py tests/test_academy_payments_api.py

      - name: Reviews API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_reviews_api.py
      - name: Reviews Chromium UI on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_reviews_ui.py
      - name: Prior Academy API regressions on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_slice1.py tests/test_academy_programs_api.py tests/test_academy_coaches_api.py tests/test_academy_batches_api.py tests/test_academy_attendance_api.py tests/test_academy_matches_api.py tests/test_academy_tournaments_api.py tests/test_academy_fees_api.py tests/test_academy_payments_api.py

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-reviews-ui-failure
          path: test-results/
          if-no-files-found: ignore
