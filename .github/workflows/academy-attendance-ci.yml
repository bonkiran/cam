name: Academy Attendance CI

on:
  push:
    branches:
      - main
      - academy-attendance-slice2d
  pull_request:
    paths:
      - 'app/academy_attendance_api.py'
      - 'app/static/academy_attendance_v1.js'
      - 'app/static/academy_attendance_v1.css'
      - 'app/static/index.html'
      - 'tests/test_academy_attendance_api.py'
      - 'tests/test_academy_attendance_ui.py'
      - 'run.py'
      - '.github/workflows/academy-attendance-ci.yml'

jobs:
  attendance-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile backend
        run: python -m compileall -q app run.py tests/test_academy_attendance_api.py
      - name: Attendance API on SQLite
        run: pytest -q tests/test_academy_attendance_api.py
      - name: Attendance API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_attendance_api.py
      - name: Prior Academy API regression on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_slice1.py tests/test_academy_programs_api.py tests/test_academy_coaches_api.py tests/test_academy_batches_api.py
      - name: Attendance Chromium UI on SQLite
        if: ${{ hashFiles('tests/test_academy_attendance_ui.py') != '' }}
        run: pytest -q tests/test_academy_attendance_ui.py
      - name: Attendance Chromium UI on PostgreSQL
        if: ${{ hashFiles('tests/test_academy_attendance_ui.py') != '' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_attendance_ui.py
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-attendance-ui-failure
          path: test-results/
          if-no-files-found: ignore
