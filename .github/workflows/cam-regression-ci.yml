name: CAM Regression CI

on:
  push:
    branches:
      - main
      - bongonfun/cam-15-cam-naming-cleanup
  pull_request:
    branches:
      - main

jobs:
  cam-regression:
    runs-on: ubuntu-latest
    env:
      CAM_TEMP_ADMIN_MODE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_cam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_cam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile application and CAM tests
        run: python -m compileall -q app run.py tests
      - name: JavaScript syntax check
        run: |
          for file in app/static/cam_*.js; do
            node --check "$file"
          done
      - name: CAM naming guard
        run: pytest -q tests/test_cam15_naming_guard.py
      - name: Import application
        run: python -c "import run; print('CAM application import OK')"
      - name: Core CAM API regression on SQLite
        run: |
          pytest -q \
            tests/test_cam_slice1.py \
            tests/test_cam_programs_api.py \
            tests/test_cam_coaches_api.py \
            tests/test_cam_batches_api.py \
            tests/test_cam_attendance_api.py \
            tests/test_cam_registration_api.py \
            tests/test_cam_enrollment_slice2a.py \
            tests/test_cam14_player_development_api.py
      - name: Core CAM API regression on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_cam_test
        run: |
          pytest -q \
            tests/test_cam_slice1.py \
            tests/test_cam_programs_api.py \
            tests/test_cam_coaches_api.py \
            tests/test_cam_batches_api.py \
            tests/test_cam_attendance_api.py \
            tests/test_cam14_player_development_api.py
      - name: Dashboard and moat browser regression on SQLite
        run: |
          pytest -q \
            tests/test_cam_route_flash_ui.py \
            tests/test_cam_players_ui.py \
            tests/test_cam_programs_ui.py \
            tests/test_cam_attendance_ui.py \
            tests/test_cam14_player_development_ui.py \
            tests/test_cam16_dashboard_attendance_entry.py
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cam-regression-ui-failure
          path: test-results/
          if-no-files-found: ignore
