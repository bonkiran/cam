name: Academy Payment Provider CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/payment_providers.py'
      - 'app/academy_payment_provider_api.py'
      - 'app/academy_enrollment_payment_api.py'
      - 'app/academy_enrollment_completion_api.py'
      - 'app/academy_dashboard_enrollment_api.py'
      - 'app/static/academy_payment_provider_integrations_v1.js'
      - 'app/static/academy_payment_provider_integrations_v1.css'
      - 'app/static/academy_enrollment_public_v1.html'
      - 'app/static/academy_enrollment_public_v1.js'
      - 'app/static/academy_enrollment_public_v1.css'
      - 'app/static/academy_enrollment_complete_v1.js'
      - 'app/static/academy_enrollment_complete_v1.css'
      - 'app/static/academy_dashboard_enrollments_v1.js'
      - 'app/static/academy_dashboard_enrollments_v1.css'
      - 'app/static/academy_dashboard_enrollment_dedupe_v1.js'
      - 'app/static/academy_dashboard_readability_v1.css'
      - 'app/static/index.html'
      - 'run.py'
      - 'tests/test_payment_provider_abstraction.py'
      - 'tests/test_payment_provider_integrations_ui.py'
      - 'tests/test_academy_enrollment_payment.py'
      - 'tests/test_academy_enrollment_completion.py'
      - 'tests/test_academy_dashboard_enrollments.py'
      - '.github/workflows/academy-payment-provider-ci.yml'
  pull_request:
    paths:
      - 'app/payment_providers.py'
      - 'app/academy_payment_provider_api.py'
      - 'app/academy_enrollment_payment_api.py'
      - 'app/academy_enrollment_completion_api.py'
      - 'app/academy_dashboard_enrollment_api.py'
      - 'app/static/academy_payment_provider_integrations_v1.js'
      - 'app/static/academy_payment_provider_integrations_v1.css'
      - 'app/static/academy_enrollment_public_v1.html'
      - 'app/static/academy_enrollment_public_v1.js'
      - 'app/static/academy_enrollment_public_v1.css'
      - 'app/static/academy_enrollment_complete_v1.js'
      - 'app/static/academy_enrollment_complete_v1.css'
      - 'app/static/academy_dashboard_enrollments_v1.js'
      - 'app/static/academy_dashboard_enrollments_v1.css'
      - 'app/static/academy_dashboard_enrollment_dedupe_v1.js'
      - 'app/static/academy_dashboard_readability_v1.css'
      - 'app/static/index.html'
      - 'run.py'
      - 'tests/test_payment_provider_abstraction.py'
      - 'tests/test_payment_provider_integrations_ui.py'
      - 'tests/test_academy_enrollment_payment.py'
      - 'tests/test_academy_enrollment_completion.py'
      - 'tests/test_academy_dashboard_enrollments.py'
      - '.github/workflows/academy-payment-provider-ci.yml'

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx2
      - name: Compile payment provider modules
        run: >-
          python -m py_compile
          app/payment_providers.py
          app/academy_payment_provider_api.py
          app/academy_enrollment_payment_api.py
          app/academy_enrollment_completion_api.py
          app/academy_dashboard_enrollment_api.py
          tests/test_payment_provider_abstraction.py
          tests/test_payment_provider_integrations_ui.py
          tests/test_academy_enrollment_payment.py
          tests/test_academy_enrollment_completion.py
          tests/test_academy_dashboard_enrollments.py
          run.py
      - name: JavaScript syntax check
        run: >-
          node --check app/static/academy_enrollment_public_v1.js &&
          node --check app/static/academy_enrollment_complete_v1.js &&
          node --check app/static/academy_dashboard_enrollments_v1.js &&
          node --check app/static/academy_dashboard_enrollment_dedupe_v1.js
      - name: Run Stripe Square contract Slice 2C-2D and dashboard enrollment tests
        run: >-
          pytest -q
          tests/test_payment_provider_abstraction.py
          tests/test_payment_provider_integrations_ui.py
          tests/test_academy_enrollment_payment.py
          tests/test_academy_enrollment_completion.py
          tests/test_academy_dashboard_enrollments.py
