name: Academy Access & Roles CI

on:
  push:
    branches:
      - main
      - academy-roles-security
  pull_request:
    paths:
      - 'app/academy_auth_api.py'
      - 'app/academy_rbac_middleware.py'
      - 'app/static/academy_access_v1.js'
      - 'app/static/academy_access_v1.css'
      - 'app/static/index.html'
      - 'tests/test_academy_auth_api.py'
      - 'tests/test_academy_auth_ui.py'
      - 'run.py'
      - '.github/workflows/academy-access-ci.yml'

jobs:
  access-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_BOOTSTRAP_TOKEN: ci-bootstrap-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile and JavaScript syntax check
        run: |
          python -m compileall -q app run.py tests/test_academy_auth_api.py tests/test_academy_auth_ui.py
          node --check app/static/academy_access_v1.js

      - name: Access API on SQLite
        run: pytest -q tests/test_academy_auth_api.py
      - name: Access Chromium UI on SQLite
        run: pytest -q tests/test_academy_auth_ui.py
      - name: Prior Academy API regressions on SQLite
        run: pytest -q tests/test_academy_slice1.py tests/test_academy_programs_api.py tests/test_academy_coaches_api.py tests/test_academy_batches_api.py tests/test_academy_attendance_api.py tests/test_academy_matches_api.py tests/test_academy_tournaments_api.py tests/test_academy_fees_api.py tests/test_academy_payments_api.py

      - name: Access API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_auth_api.py
      - name: Access Chromium UI on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_auth_ui.py
      - name: Reset Access auth state before prior PostgreSQL regressions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  tables = []
                  for table in ('academy_auth_sessions', 'academy_access_audit', 'academy_users'):
                      cur.execute('SELECT to_regclass(%s)', (f'public.{table}',))
                      if cur.fetchone()[0] is not None:
                          tables.append(table)
                  if tables:
                      cur.execute(f"TRUNCATE TABLE {', '.join(tables)} RESTART IDENTITY CASCADE")
              conn.commit()
          PY
      - name: Prior Academy API regressions on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_slice1.py tests/test_academy_programs_api.py tests/test_academy_coaches_api.py tests/test_academy_batches_api.py tests/test_academy_attendance_api.py tests/test_academy_matches_api.py tests/test_academy_tournaments_api.py tests/test_academy_fees_api.py tests/test_academy_payments_api.py

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-access-ui-failure
          path: test-results/
          if-no-files-found: ignore