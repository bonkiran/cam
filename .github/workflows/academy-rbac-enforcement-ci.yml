name: Academy Core RBAC CI

on:
  push:
    branches:
      - main
      - academy-rbac-core-enforcement
  pull_request:
    paths:
      - 'app/academy_auth_api.py'
      - 'app/academy_authz.py'
      - 'app/academy_rbac_middleware.py'
      - 'app/static/academy_session_fetch_v1.js'
      - 'app/static/index.html'
      - 'tests/test_academy_rbac_enforcement_api.py'
      - 'tests/test_academy_rbac_enforcement_ui.py'
      - 'tests/test_academy_auth_api.py'
      - 'tests/test_academy_parent_billing_api.py'
      - 'run.py'
      - '.github/workflows/academy-rbac-enforcement-ci.yml'

jobs:
  rbac-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_BOOTSTRAP_TOKEN: rbac-ci-bootstrap
      CAM_PAYMENT_MODE: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile and JavaScript syntax check
        run: |
          python -m compileall -q app run.py tests/test_academy_rbac_enforcement_api.py tests/test_academy_rbac_enforcement_ui.py
          node --check app/static/academy_session_fetch_v1.js

      - name: Core RBAC API on SQLite
        run: pytest -q tests/test_academy_rbac_enforcement_api.py
      - name: Core RBAC Chromium UI on SQLite
        run: pytest -q tests/test_academy_rbac_enforcement_ui.py
      - name: Existing Access API on SQLite
        run: pytest -q tests/test_academy_auth_api.py
      - name: Existing Parent Billing API on SQLite
        run: pytest -q tests/test_academy_parent_billing_api.py

      - name: Core RBAC API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_rbac_enforcement_api.py
      - name: Core RBAC Chromium UI on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_rbac_enforcement_ui.py
      - name: Existing Access API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_auth_api.py
      - name: Existing Parent Billing API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_parent_billing_api.py

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-rbac-ui-failure
          path: test-results/
          if-no-files-found: ignore
