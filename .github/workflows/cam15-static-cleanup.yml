name: CAM-15 Static Namespace Cleanup

on:
  push:
    branches:
      - bongonfun/cam-15-cam-naming-cleanup
    paths:
      - 'scripts/cam15_static_cleanup.py'
      - '.github/workflows/cam15-static-cleanup.yml'

permissions:
  contents: write

jobs:
  rename-static-namespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: bongonfun/cam-15-cam-naming-cleanup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename static files and references
        run: python scripts/cam15_static_cleanup.py
      - name: Commit static cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No static cleanup changes."
          else
            git commit -m "CAM-15 rename frontend technical namespace to CAM"
            git push origin HEAD:bongonfun/cam-15-cam-naming-cleanup
          fi
