name: CAM-15 Runtime Namespace Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-runtime-namespace:
    if: github.head_ref == 'bongonfun/cam-15-cam-naming-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: bongonfun/cam-15-cam-naming-cleanup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run runtime namespace migration
        run: python scripts/cam15_naming_cleanup_runtime.py
      - name: Commit runtime cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated runtime cleanup changes."
          else
            git commit -m "CAM-15 normalize runtime namespace from Academy to CAM"
            git push origin HEAD:bongonfun/cam-15-cam-naming-cleanup
          fi
