name: Seed Full Academy Manual-Test Data

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/reset_demo_finance.py'
      - 'scripts/seed_full_academy_demo.py'
      - 'scripts/fix_full_demo_dashboard_data.py'
      - 'scripts/verify_full_demo_dashboard.py'
      - '.github/workflows/seed-full-academy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-full-academy-seeder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate seeder syntax
        run: >-
          python -m py_compile
          scripts/reset_demo_finance.py
          scripts/seed_full_academy_demo.py
          scripts/fix_full_demo_dashboard_data.py
          scripts/verify_full_demo_dashboard.py

  seed-full-academy-data:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-full-academy-seeder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove prior DEMO finance fixture records
        env:
          CRICKANALYSIS_BASE_URL: https://crickanalysis.onrender.com
        run: python scripts/reset_demo_finance.py
      - name: Seed comprehensive academy manual-test dataset
        env:
          CRICKANALYSIS_BASE_URL: https://crickanalysis.onrender.com
        run: python scripts/seed_full_academy_demo.py
      - name: Correct dashboard registration dates and seed coach salary payments
        env:
          CRICKANALYSIS_BASE_URL: https://crickanalysis.onrender.com
        run: python scripts/fix_full_demo_dashboard_data.py
      - name: Reconcile dashboard totals
        env:
          CRICKANALYSIS_BASE_URL: https://crickanalysis.onrender.com
        run: python scripts/verify_full_demo_dashboard.py
