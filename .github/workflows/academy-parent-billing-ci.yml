name: Academy Parent Billing CI

on:
  push:
    branches:
      - main
      - academy-rbac-enforcement
  pull_request:
    paths:
      - 'app/academy_auth_api.py'
      - 'app/academy_authz.py'
      - 'app/academy_rbac_middleware.py'
      - 'app/academy_parent_billing_api.py'
      - 'app/academy_fees_api.py'
      - 'app/academy_payments_v2_api.py'
      - 'app/static/academy_parent_portal_v1.js'
      - 'app/static/academy_parent_portal_v1.css'
      - 'app/static/index.html'
      - 'tests/test_academy_parent_billing_api.py'
      - 'tests/test_academy_parent_billing_ui.py'
      - 'run.py'
      - '.github/workflows/academy-parent-billing-ci.yml'

jobs:
  parent-billing-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_BOOTSTRAP_TOKEN: parent-billing-ci-bootstrap
      CAM_PAYMENT_MODE: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile and JavaScript syntax check
        run: |
          python -m compileall -q app run.py tests/test_academy_parent_billing_api.py tests/test_academy_parent_billing_ui.py
          node --check app/static/academy_parent_portal_v1.js

      - name: Parent billing API on SQLite
        run: pytest -q tests/test_academy_parent_billing_api.py
      - name: Parent billing Chromium UI on SQLite
        run: pytest -q tests/test_academy_parent_billing_ui.py
      - name: Existing access API on SQLite
        run: pytest -q tests/test_academy_auth_api.py
      - name: Existing fees API on SQLite
        run: pytest -q tests/test_academy_fees_api.py
      - name: Existing payments API on SQLite
        run: pytest -q tests/test_academy_payments_api.py

      # PostgreSQL uses one service DB across steps. The Access regression
      # deliberately creates users, so clear only authentication state before
      # running legacy Fees/Payments suites under pre-bootstrap compatibility.
      - name: Existing access API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_auth_api.py
      - name: Reset Access auth state before legacy finance regressions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  tables = []
                  for table in ('academy_auth_sessions', 'academy_access_audit', 'academy_users'):
                      cur.execute('SELECT to_regclass(%s)', (f'public.{table}',))
                      if cur.fetchone()[0] is not None:
                          tables.append(table)
                  if tables:
                      cur.execute(f"TRUNCATE TABLE {', '.join(tables)} RESTART IDENTITY CASCADE")
              conn.commit()
          PY
      - name: Existing fees API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_fees_api.py
      - name: Existing payments API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_payments_api.py
      - name: Parent billing API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_parent_billing_api.py
      - name: Parent billing Chromium UI on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_academy_parent_billing_ui.py

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-parent-billing-ui-failure
          path: test-results/
          if-no-files-found: ignore