name: CAM-16 Dashboard Attendance Patch

on:
  push:
    branches:
      - bongonfun/cam-15-cam-naming-cleanup
    paths:
      - 'scripts/cam16_dashboard_attendance_patch.py'
      - '.github/workflows/cam16-dashboard-attendance-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CAM cleanup branch
        uses: actions/checkout@v4
        with:
          ref: bongonfun/cam-15-cam-naming-cleanup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Dashboard attendance and three-state attendance patch
        run: python scripts/cam16_dashboard_attendance_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No CAM-16 changes to commit."
          else
            git commit -m "CAM-16 expose attendance from Dashboard and use three statuses"
            git push origin HEAD:bongonfun/cam-15-cam-naming-cleanup
          fi
