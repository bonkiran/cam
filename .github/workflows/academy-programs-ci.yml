name: Academy Programs & Enrollment CI

on:
  push:
    branches:
      - academy-programs-enrollment-v1
  pull_request:
    paths:
      - 'app/academy_programs_api.py'
      - 'app/static/academy_programs_v1.js'
      - 'app/static/academy_programs_v1.css'
      - 'app/static/index.html'
      - 'tests/test_academy_programs_api.py'
      - 'tests/test_academy_programs_ui.py'
      - 'run.py'

jobs:
  programs-enrollment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_programs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_programs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium

      - name: Compile Python
        run: python -m compileall -q app run.py tests/test_academy_programs_api.py

      - name: Check Programs JavaScript syntax
        if: hashFiles('app/static/academy_programs_v1.js') != ''
        run: node --check app/static/academy_programs_v1.js

      - name: Run Programs API on SQLite fallback
        run: pytest -q tests/test_academy_programs_api.py

      - name: Run Programs API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_programs_test
        run: pytest -q tests/test_academy_programs_api.py

      - name: Run Programs browser UI on SQLite fallback
        if: hashFiles('tests/test_academy_programs_ui.py') != ''
        run: pytest -q tests/test_academy_programs_ui.py

      - name: Run Programs browser UI on PostgreSQL
        if: hashFiles('tests/test_academy_programs_ui.py') != ''
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_programs_test
        run: pytest -q tests/test_academy_programs_ui.py

      - name: Re-run Slice 1 regression on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_programs_test
        run: pytest -q tests/test_academy_slice1.py
