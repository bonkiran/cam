name: Academy Route Flash CI

on:
  push:
    branches:
      - main
      - fix-academy-route-flash
      - fix-academy-navigation-performance
      - ui-navigation-cleanup
      - analysis-horizontal-tabs
      - pause-analysis-runtime
    paths:
      - 'app/static/academy_route_guard.js'
      - 'app/static/academy_navigation_performance_v1.js'
      - 'app/static/academy_dashboard_first_paint_v1.js'
      - 'app/static/academy_dashboard_first_paint_v1.css'
      - 'app/static/academy_reports_tab_v1.js'
      - 'app/static/analysis_pause_v1.js'
      - 'app/static/analysis_workspace_tabs_v1.js'
      - 'app/static/analysis_workspace_tabs_v1.css'
      - 'app/static/nav_structure_v3.js'
      - 'app/static/index.html'
      - 'tests/test_academy_route_flash_ui.py'
      - 'tests/test_academy_navigation_performance_ui.py'
      - 'tests/test_ui_navigation_cleanup.py'
      - '.github/workflows/academy-route-flash-ci.yml'
  pull_request:
    paths:
      - 'app/static/academy_route_guard.js'
      - 'app/static/academy_navigation_performance_v1.js'
      - 'app/static/academy_dashboard_first_paint_v1.js'
      - 'app/static/academy_dashboard_first_paint_v1.css'
      - 'app/static/academy_reports_tab_v1.js'
      - 'app/static/analysis_pause_v1.js'
      - 'app/static/analysis_workspace_tabs_v1.js'
      - 'app/static/analysis_workspace_tabs_v1.css'
      - 'app/static/nav_structure_v3.js'
      - 'app/static/index.html'
      - 'tests/test_academy_route_flash_ui.py'
      - 'tests/test_academy_navigation_performance_ui.py'
      - 'tests/test_ui_navigation_cleanup.py'
      - '.github/workflows/academy-route-flash-ci.yml'

jobs:
  route-flash-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: JavaScript syntax check
        run: |
          node --check app/static/academy_route_guard.js
          node --check app/static/academy_navigation_performance_v1.js
          node --check app/static/academy_dashboard_first_paint_v1.js
          node --check app/static/academy_reports_tab_v1.js
          node --check app/static/analysis_pause_v1.js
          node --check app/static/analysis_workspace_tabs_v1.js
          node --check app/static/nav_structure_v3.js
      - name: Academy route no-flash browser regression
        run: pytest -q tests/test_academy_route_flash_ui.py
      - name: Academy navigation performance browser regression
        run: pytest -q tests/test_academy_navigation_performance_ui.py
      - name: Workspace navigation and paused Analysis regression
        run: pytest -q tests/test_ui_navigation_cleanup.py
