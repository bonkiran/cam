name: Academy Route Flash CI

on:
  push:
    branches:
      - main
      - fix-academy-route-flash
    paths:
      - 'app/static/academy_route_guard.js'
      - 'app/static/index.html'
      - 'tests/test_academy_route_flash_ui.py'
      - '.github/workflows/academy-route-flash-ci.yml'
  pull_request:
    paths:
      - 'app/static/academy_route_guard.js'
      - 'app/static/index.html'
      - 'tests/test_academy_route_flash_ui.py'
      - '.github/workflows/academy-route-flash-ci.yml'

jobs:
  route-flash-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: JavaScript syntax check
        run: node --check app/static/academy_route_guard.js
      - name: Academy route no-flash browser regression
        run: pytest -q tests/test_academy_route_flash_ui.py
