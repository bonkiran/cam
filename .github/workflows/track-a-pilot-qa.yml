name: Track A Pilot QA

on:
  push:
    branches:
      - track-a-pilot-qa
  pull_request:
    branches:
      - main
    paths:
      - 'app/cam_*.py'
      - 'app/static/cam_batch_roster_lifecycle_v1.js'
      - 'app/static/cam_tournament_type_v1.js'
      - 'app/static/index.html'
      - 'tests/test_track_a_core_qa.py'
      - 'tests/test_track_a_batches_sessions_qa.py'
      - 'tests/test_track_a_batch_roster_ui.py'
      - 'tests/test_track_a_attendance_security_qa.py'
      - 'tests/test_track_a_tournament_type_qa.py'
      - 'tests/test_track_a_tournament_type_ui.py'
      - 'tests/test_track_a_reconciliation_qa.py'
      - 'tests/test_cam_programs_api.py'
      - 'tests/test_cam_coaches_api.py'
      - 'tests/test_cam_batches_api.py'
      - 'tests/test_cam_matches_api.py'
      - 'tests/test_cam_tournaments_api.py'
      - 'tests/test_cam_rbac_enforcement_api.py'
      - 'tests/test_cam_auth_api.py'
      - 'tests/test_cam_parent_billing_api.py'
      - '.github/workflows/track-a-pilot-qa.yml'
      - 'run.py'

jobs:
  track-a-core-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_PAYMENT_MODE: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile Track A test surface
        run: |
          python -m compileall -q app run.py \
            tests/test_track_a_core_qa.py \
            tests/test_track_a_batches_sessions_qa.py \
            tests/test_track_a_batch_roster_ui.py \
            tests/test_track_a_attendance_security_qa.py \
            tests/test_track_a_tournament_type_qa.py \
            tests/test_track_a_tournament_type_ui.py \
            tests/test_track_a_reconciliation_qa.py \
            tests/test_cam_programs_api.py \
            tests/test_cam_coaches_api.py \
            tests/test_cam_batches_api.py \
            tests/test_cam_matches_api.py \
            tests/test_cam_tournaments_api.py \
            tests/test_cam_rbac_enforcement_api.py \
            tests/test_cam_auth_api.py \
            tests/test_cam_parent_billing_api.py
          node --check app/static/cam_batch_roster_lifecycle_v1.js
          node --check app/static/cam_tournament_type_v1.js
      - name: Track A core permutations on SQLite
        run: pytest -q tests/test_track_a_core_qa.py
      - name: Programs and enrollment lifecycle on SQLite
        run: pytest -q tests/test_cam_programs_api.py
      - name: Coach lifecycle on SQLite
        run: pytest -q tests/test_cam_coaches_api.py
      - name: Existing Batches and Sessions on SQLite
        run: pytest -q tests/test_cam_batches_api.py
      - name: Track A roster lifecycle on SQLite
        run: pytest -q tests/test_track_a_batches_sessions_qa.py
      - name: Track A roster browser flow on SQLite
        run: pytest -q tests/test_track_a_batch_roster_ui.py
      - name: Attendance statuses, corrections, and role boundaries on SQLite
        run: pytest -q tests/test_track_a_attendance_security_qa.py
      - name: Teams and Matches on SQLite
        run: pytest -q tests/test_cam_matches_api.py
      - name: Tournament lifecycle on SQLite
        run: pytest -q tests/test_cam_tournaments_api.py
      - name: Internal and external Tournament types on SQLite
        run: pytest -q tests/test_track_a_tournament_type_qa.py
      - name: Tournament type Chromium flow on SQLite
        run: pytest -q tests/test_track_a_tournament_type_ui.py
      - name: Track A reconciliation permutations on SQLite
        run: pytest -q tests/test_track_a_reconciliation_qa.py
      - name: Generic RBAC boundary on SQLite
        run: pytest -q tests/test_cam_rbac_enforcement_api.py
      - name: Access lifecycle on SQLite
        run: pytest -q tests/test_cam_auth_api.py
      - name: Parent family isolation and billing on SQLite
        run: pytest -q tests/test_cam_parent_billing_api.py
      - name: Coach lifecycle on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_coaches_api.py
      - name: Existing Batches and Sessions on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_batches_api.py
      - name: Programs and enrollment lifecycle on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_programs_api.py
      - name: Track A roster lifecycle on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_batches_sessions_qa.py
      - name: Track A roster browser flow on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_batch_roster_ui.py
      - name: Teams and Matches on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_matches_api.py
      - name: Tournament lifecycle on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_tournaments_api.py
      - name: Internal and external Tournament types on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_tournament_type_qa.py
      - name: Tournament type Chromium flow on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_tournament_type_ui.py
      - name: Attendance statuses, corrections, and role boundaries on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_attendance_security_qa.py
      - name: Track A reconciliation permutations on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_reconciliation_qa.py
      - name: Track A core permutations on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_track_a_core_qa.py
      - name: Generic RBAC boundary on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_rbac_enforcement_api.py
      - name: Access lifecycle on PostgreSQL
        env: {DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test}
        run: pytest -q tests/test_cam_auth_api.py
      - name: Parent family isolation and billing on PostgreSQL
