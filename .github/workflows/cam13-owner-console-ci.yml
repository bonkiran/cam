name: CAM-13 Owner Console CI

on:
  push:
    branches:
      - cam-13-owner-console-refactor
  pull_request:
    branches:
      - main
    paths:
      - 'app/cam_owner_console_api.py'
      - 'app/static/cam_owner_console_v1.js'
      - 'app/static/cam_owner_console_v1.css'
      - 'app/static/index.html'
      - 'tests/test_cam13_owner_console_api.py'
      - 'tests/test_cam13_owner_console_ui.py'
      - 'run.py'
      - '.github/workflows/cam13-owner-console-ci.yml'

jobs:
  owner-console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crickanalysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crickanalysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_PAYMENT_MODE: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install chromium
      - name: Compile CAM-13 Python surface
        run: python -m compileall -q app run.py tests/test_cam13_owner_console_api.py tests/test_cam13_owner_console_ui.py
      - name: Check CAM-13 JavaScript syntax
        run: |
          node --check app/static/cam_owner_console_v1.js
          node --check app/static/cam_dashboard_v2.js
      - name: Owner console API on SQLite
        run: pytest -q tests/test_cam13_owner_console_api.py
      - name: Owner console Chromium UI on SQLite
        run: pytest -q tests/test_cam13_owner_console_ui.py
      - name: Owner console API on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_cam13_owner_console_api.py
      - name: Owner console Chromium UI on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crickanalysis_test
        run: pytest -q tests/test_cam13_owner_console_ui.py
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cam13-owner-console-failure
          path: test-results/
          if-no-files-found: ignore
